<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05070f">
<meta name="version" content="2026-11-25 tema tech + telegram">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Intranet</title>
<link rel="icon" href="config/logo.svg" type="image/svg+xml">
<style>
  /* ===== Tema tecnológico: fondo oscuro, neón cian / violeta, vidrio ===== */
  :root {
    --overlay: .55;
    --font: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --bg: #05070f;
    --ink: #e6edf7;
    --muted: #8b98b0;
    --glass: rgba(15, 23, 42, .55);
    --glass-line: rgba(148, 163, 184, .18);
    --maxw: 1240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg) center / cover no-repeat fixed;
    display: flex; flex-direction: column; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .skip { position: absolute; left: -9999px; top: 0; background: #fff; color: #000; padding: 8px 12px; z-index: 60; }
  .skip:focus { left: 8px; }

  /* ----- Fondo animado ----- */
  #bg { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; display: block; pointer-events: none; }
  /* grilla en perspectiva + halos de color */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 50% at 15% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      radial-gradient(50% 45% at 90% 20%, color-mix(in srgb, var(--accent2) 22%, transparent), transparent 70%),
      radial-gradient(70% 60% at 50% 110%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
      linear-gradient(180deg, rgba(5,7,15,var(--overlay)) 0%, rgba(5,7,15,calc(var(--overlay) + .2)) 100%);
  }
  body::after {
    content: ""; position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55%; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(color-mix(in srgb, var(--accent) 30%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--accent) 30%, transparent) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: bottom;
    mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 85%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.55), transparent 85%);
    animation: gridmove 6s linear infinite;
  }
  @keyframes gridmove { to { background-position: 0 60px, 0 0; } }

  /* ----- Barra de anuncios ----- */
  .announce {
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 25%, #000), color-mix(in srgb, var(--accent2) 25%, #000));
    color: #fff; text-align: center; font-family: var(--mono);
    font-size: .74rem; letter-spacing: .08em;
    padding: 8px 16px; line-height: 1.5; border-bottom: 1px solid var(--glass-line);
  }
  .announce::before { content: "▸ "; color: var(--accent); }
  .announce a { text-decoration: underline; text-underline-offset: 3px; }

  /* ----- Encabezado ----- */
  .hero { position: relative; text-align: center; padding: clamp(26px, 4vw, 48px) 20px clamp(22px, 3vw, 34px); }
  .hero #brand { display: inline-flex; align-items: center; gap: 14px; }
  .hero img.logo { height: clamp(40px, 6vw, 56px); width: auto; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 60%, transparent)); }
  .hero h1 {
    font-weight: 800; font-size: clamp(1.9rem, 5vw, 3rem); letter-spacing: -.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .sub {
    margin-top: 8px; font-family: var(--mono); font-size: .8rem; letter-spacing: .2em;
    text-transform: uppercase; color: var(--muted);
  }
  .hero .sub::after { content: "_"; color: var(--accent); animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero .greet { margin-top: 14px; font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 700; }
  .hero .date { margin-top: 4px; font-size: .82rem; color: var(--muted); }
  .hero .clock { font-family: var(--mono); font-size: clamp(1.4rem, 3vw, 1.9rem); font-weight: 700; color: var(--accent); text-shadow: 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); margin-top: 6px; letter-spacing: .06em; }

  /* Buscador */
  .search { margin: 18px auto 0; max-width: 520px; position: relative; }
  .search input {
    width: 100%; font: inherit; font-size: .95rem; color: var(--ink);
    padding: 13px 48px 13px 44px; border-radius: 12px;
    background: rgba(15,23,42,.7); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 10px 30px rgba(0,0,0,.35); }
  .search svg { z-index: 1; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--accent); pointer-events: none; }
  .search kbd {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font: 700 .72rem/1 var(--mono); color: var(--muted);
    border: 1px solid var(--glass-line); border-radius: 6px; padding: 4px 7px;
  }

  /* Navegación por áreas */
  .areas {
    position: sticky; top: 0; z-index: 5;
    background: rgba(5,7,15,.6);
    -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    border-top: 1px solid var(--glass-line); border-bottom: 1px solid var(--glass-line);
  }
  .areas ul {
    list-style: none; display: flex; gap: 4px; justify-content: center;
    max-width: var(--maxw); margin: 0 auto; padding: 0 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .areas ul::-webkit-scrollbar { display: none; }
  .areas a {
    display: block; white-space: nowrap; text-decoration: none;
    padding: 11px 14px 9px; font-family: var(--mono); font-size: .74rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
    border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
  }
  .areas a:hover, .areas a:focus-visible, .areas a.on { color: var(--accent); border-bottom-color: var(--accent); outline: none; }

  /* ----- Contenido ----- */
  main {
    flex: 1; width: 100%; max-width: var(--maxw); margin: 0 auto;
    padding: 30px 20px 72px; display: flex; flex-direction: column; gap: 46px;
  }
  .group { scroll-margin-top: 56px; }
  .group h2 {
    font-family: var(--mono); font-size: clamp(1rem, 2.2vw, 1.25rem); font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
  }
  .group h2::before { content: "//"; color: var(--accent); }
  .group h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 60%, transparent), transparent); }
  .group h2 small { font-size: .7rem; font-weight: 400; letter-spacing: .1em; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    min-height: 118px; padding: 20px 50px 20px 20px;
    color: var(--ink); text-decoration: none;
    background: linear-gradient(145deg, rgba(30,41,59,.62), rgba(15,23,42,.5));
    -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid var(--glass-line); border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition: transform .25s, box-shadow .25s, border-color .25s, background .25s;
  }
  /* borde luminoso que sigue al mouse */
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%);
    transition: opacity .25s;
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card .ico {
    width: 42px; height: 42px; display: grid; place-items: center;
    font-size: 1.25rem; line-height: 1; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .card .name { position: relative; font-weight: 700; font-size: 1rem; }
  .card .desc { position: relative; font-size: .84rem; line-height: 1.45; color: var(--muted); }
  .card .host { position: relative; font-family: var(--mono); font-size: .7rem; color: color-mix(in srgb, var(--accent) 70%, var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .go {
    position: absolute; right: 16px; top: 50%; margin-top: -16px;
    width: 32px; height: 32px; display: grid; place-items: center;
    font-size: 1rem; line-height: 1; border-radius: 50%; color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    transition: transform .25s, background .25s, color .25s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px); outline: none;
    border-color: color-mix(in srgb, var(--accent) 65%, transparent);
    box-shadow: 0 16px 40px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 30px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .card:hover .go, .card:focus-visible .go { background: var(--accent); color: #001018; transform: translateX(3px); }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .card { background: rgba(15,23,42,.92); }
    .areas { background: rgba(5,7,15,.92); }
  }

  .msg { text-align: center; color: var(--muted); font-size: .95rem; line-height: 1.6; padding: 24px; }
  .empty { display: none; }

  /* ----- Pie ----- */
  footer { background: rgba(5,7,15,.7); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--glass-line); }
  .foot {
    max-width: var(--maxw); margin: 0 auto; padding: 36px 20px 26px;
    display: flex; flex-wrap: wrap; gap: 28px; justify-content: space-between; align-items: flex-start;
  }
  .foot img { height: 30px; width: auto; }
  .foot .brand p { margin-top: 12px; font-size: .82rem; line-height: 1.6; color: var(--muted); max-width: 420px; }
  .foot nav { display: flex; flex-wrap: wrap; gap: 10px 26px; }
  .foot nav a { font-family: var(--mono); font-size: .76rem; letter-spacing: .08em; text-decoration: none; color: var(--accent); }
  .foot nav a:hover, .foot nav a:focus-visible { text-decoration: underline; text-underline-offset: 4px; outline: none; }
  .legal {
    border-top: 1px solid var(--glass-line); text-align: center; padding: 14px 20px;
    font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; color: var(--muted);
  }

  /* ===== Edición desde la web ===== */
  .item { position: relative; display: flex; }
  .item > .card { flex: 1; }
  .tools {
    position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px;
    opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s;
  }
  .item:hover .tools, .item:focus-within .tools { opacity: 1; transform: none; }
  @media (hover: none) { .tools { opacity: 1; transform: none; } }
  .tbtn {
    width: 28px; height: 28px; display: grid; place-items: center; cursor: pointer;
    font: 700 .8rem/1 var(--font); color: var(--ink); border-radius: 8px;
    background: rgba(5,7,15,.8); border: 1px solid var(--glass-line);
  }
  .tbtn:hover, .tbtn:focus-visible { background: var(--accent); color: #001018; outline: none; }
  .tbtn.danger:hover, .tbtn.danger:focus-visible { background: #ef4444; color: #fff; border-color: #ef4444; }
  .item:has(.tools):hover .card .go, .item:has(.tools):focus-within .card .go { opacity: 0; }

  .add {
    min-height: 118px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; font: 700 .78rem var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); background: rgba(15,23,42,.3);
    border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 14px;
    transition: background .2s, color .2s, border-color .2s, transform .2s;
  }
  .add .plus { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 1.4rem; font-weight: 400; border: 1.5px solid currentColor; }
  .add:hover, .add:focus-visible { color: var(--accent); border-color: var(--accent); border-style: solid; transform: translateY(-4px); outline: none; }

  .area-del { margin-inline-start: auto; font: .68rem var(--mono); letter-spacing: .1em; text-transform: uppercase; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .area-del:hover { color: #ef4444; text-decoration: underline; }
  .new-area { align-self: center; padding: 14px 28px; }

  /* Ventanas */
  dialog {
    margin: auto; width: min(520px, calc(100% - 32px)); border-radius: 16px; padding: 0;
    color: var(--ink); background: #0b1222; border: 1px solid var(--glass-line);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 40px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  dialog::backdrop { background: rgba(2,4,10,.7); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  dialog form { padding: 28px 28px 24px; display: grid; gap: 16px; }
  dialog h3 { font-size: 1.15rem; }
  dialog h3 small { display: block; margin-top: 4px; font-size: .78rem; font-weight: 400; color: var(--muted); }
  dialog label { display: grid; gap: 6px; font-family: var(--mono); font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  dialog label span.opt { font-weight: 400; letter-spacing: .02em; text-transform: none; }
  dialog input, dialog select, dialog textarea {
    font: 400 .95rem/1.4 var(--font); color: var(--ink); padding: 11px 12px;
    border: 1px solid var(--glass-line); border-radius: 8px; background: #050914; width: 100%;
  }
  dialog textarea { resize: vertical; min-height: 64px; }
  dialog input:focus, dialog select:focus, dialog textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .row2 { display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
  .emojis { display: flex; flex-wrap: wrap; gap: 4px; }
  .emojis button { font-size: 1.1rem; width: 34px; height: 34px; border: 1px solid var(--glass-line); border-radius: 8px; background: #050914; cursor: pointer; }
  .emojis button:hover { border-color: var(--accent); }
  .err { color: #f87171; font-size: .85rem; min-height: 1em; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    font: 700 .78rem var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    padding: 12px 22px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #001018; transition: background .2s, color .2s, box-shadow .2s;
  }
  .btn:hover, .btn:focus-visible { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 55%, transparent); outline: none; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--glass-line); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
  .btn.light { background: rgba(15,23,42,.6); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .btn[disabled] { opacity: .5; cursor: wait; }

  .editbtn {
    position: fixed; right: 20px; bottom: 20px; z-index: 40; cursor: pointer;
    font: 700 .74rem var(--mono); letter-spacing: .1em; text-transform: uppercase;
    padding: 12px 20px; color: var(--ink); border-radius: 30px;
    background: rgba(5,7,15,.75); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: background .2s, color .2s;
  }
  .editbtn:hover, .editbtn:focus-visible, .editbtn.on { background: var(--accent); color: #001018; outline: none; }
  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 20px); z-index: 50;
    background: #0b1222; color: var(--ink); padding: 13px 22px; font-size: .88rem;
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 600px) {
    .areas ul { justify-content: flex-start; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { min-height: 100px; padding: 16px 14px; }
    .card .go, .card .host { display: none; }
    .search kbd { display: none; }
  }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<a class="skip" href="#main">Saltar al contenido</a>

<div class="announce" id="announce" hidden></div>

<header class="hero" id="hero">
  <div id="brand"><h1 id="title">Intranet</h1></div>
  <p class="sub" id="subtitle"></p>
  <p class="greet" id="greet"></p>
  <p class="clock" id="clock" aria-hidden="true"></p>
  <p class="date" id="date"></p>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar herramienta, sistema o área…" aria-label="Buscar un sistema o sitio" autocomplete="off">
    <kbd>/</kbd>
  </div>
</header>

<nav class="areas" id="areas" aria-label="Áreas"><ul></ul></nav>

<main id="main"><p class="msg">Cargando…</p></main>

<footer>
  <div class="foot">
    <div class="brand" id="footBrand"><p id="footText"></p></div>
    <nav id="footLinks" aria-label="Enlaces"></nav>
  </div>
  <div class="legal" id="legal">Uso interno</div>
</footer>


<dialog id="dlg">
  <form id="frm" method="dialog" novalidate>
    <h3 id="dlgTitle">Agregar sitio<small id="dlgArea"></small></h3>
    <label>Nombre
      <input id="fName" maxlength="60" required placeholder="Ej: Facturación">
    </label>
    <label>Link
      <input id="fHref" type="url" maxlength="2000" required placeholder="https://…">
    </label>
    <label>Descripción <span class="opt">(opcional, hasta 160 caracteres)</span>
      <textarea id="fDesc" maxlength="160" placeholder="Para qué sirve este sitio"></textarea>
    </label>
    <div class="row2">
      <label>Ícono <span class="opt">(opcional)</span>
        <input id="fIcon" maxlength="8" placeholder="📦">
      </label>
      <label>Se abre en
        <select id="fTarget"><option value="_blank">Pestaña nueva</option><option value="_self">La misma pestaña</option></select>
      </label>
    </div>
    <div class="emojis" id="emojis" aria-label="Íconos sugeridos"></div>
    <p class="err" id="fErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="fCancel">Cancelar</button>
      <button type="submit" class="btn" id="fSave">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgArea2">
  <form id="frmArea" method="dialog" novalidate>
    <h3>Nueva área<small>Por ejemplo: RRHH, MARKETING, LOGÍSTICA</small></h3>
    <label>Nombre del área <input id="aName" maxlength="40" required></label>
    <p class="err" id="aErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="aCancel">Cancelar</button>
      <button type="submit" class="btn" id="aSave">Crear área</button>
    </div>
  </form>
</dialog>

<dialog id="dlgLogin">
  <form id="frmLogin" method="dialog" novalidate>
    <h3>Modo edición<small>Ingresá la clave de tu área para agregar o modificar sitios</small></h3>
    <label>Clave <input id="lPin" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn ghost" id="lCancel">Cancelar</button>
      <button type="submit" class="btn" id="lSave">Entrar</button>
    </div>
  </form>
</dialog>

<button type="button" class="editbtn" id="editBtn" hidden>🔒 Editar</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="msg">Esta página necesita JavaScript habilitado.</p></noscript>

<script src="vendor/js-yaml.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const slug = (s) => 'area-' + String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const safeHref = (h) => /^(https?:|mailto:|tel:|\/|\.\/|#)/i.test(String(h).trim()) ? String(h).trim() : null;

async function loadYaml(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' (' + r.status + ')');
  return jsyaml.load(await r.text());
}

function applySettings(s) {
  s = s || {};
  const root = document.documentElement;
  if (s.font) root.style.setProperty('--font', s.font);
  if (s.overlay !== undefined) root.style.setProperty('--overlay', s.overlay);
  if (s.accent) root.style.setProperty('--accent', s.accent);
  if (s.accent2) root.style.setProperty('--accent2', s.accent2);
  const bgMode = String(s.background || 'animated');
  if (bgMode !== 'animated' && bgMode !== 'none') {
    const u = safeHref(bgMode);
    if (u) document.body.style.backgroundImage = 'url("' + u.replace(/"/g, '%22') + '")';
  }
  if (bgMode !== 'none') startBackground(bgMode === 'animated' ? 1 : .55);
  const title = s.title || 'Intranet';
  document.title = (s.subtitle ? s.subtitle + ' · ' : '') + title;
  $('#subtitle').textContent = s.subtitle || '';

  // Logo: se mantiene igual que antes (si no hay logo, el título en texto)
  if (s.logo) {
    const mk = () => { const i = el('img', 'logo'); i.src = s.logo; i.alt = ''; return i; };
    $('#title').textContent = title;
    $('#brand').prepend(mk());
    const f = mk(); f.className = ''; f.alt = title; $('#footBrand').prepend(f);
  } else {
    $('#title').textContent = title;
    const t = el('strong', null, title);
    $('#footBrand').prepend(t);
  }

  // Barra de anuncios opcional
  if (s.announcement) {
    const a = $('#announce');
    const link = s.announcement_href && safeHref(s.announcement_href);
    if (link) { const l = el('a', null, s.announcement); l.href = link; a.append(l); }
    else a.textContent = s.announcement;
    a.hidden = false;
  }

  $('#footText').textContent = s.footer_text || '';
  $('#legal').textContent = s.footer || ('Uso interno · ' + title + ' · ' + new Date().getFullYear());
  $('#legal').append(el('span', null, ' · v2026.11.25'));
  (Array.isArray(s.footer_links) ? s.footer_links : []).forEach(it => {
    Object.entries(it || {}).forEach(([name, href]) => {
      const h = safeHref(typeof href === 'object' ? href.href : href);
      if (!h) return;
      const a = el('a', null, name); a.href = h; a.target = '_blank'; a.rel = 'noopener';
      $('#footLinks').append(a);
    });
  });

  // Saludo y fecha
  if (s.greeting !== false) {
    const h = new Date().getHours();
    $('#greet').textContent = h < 12 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
    const d = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('#date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
    const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); };
    tick(); setInterval(tick, 1000);
  }
}

function hostOf(href) {
  try { return new URL(href, location.href).host; } catch { return ''; }
}

// ===== Fondo animado: red de nodos conectados que reacciona al mouse =====
function startBackground(alpha) {
  const cv = $('#bg'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const css = getComputedStyle(document.documentElement);
  const c1 = css.getPropertyValue('--accent').trim() || '#22d3ee';
  const c2 = css.getPropertyValue('--accent2').trim() || '#a78bfa';
  let W = 0, H = 0, DPR = 1, pts = [], mouse = { x: -9999, y: -9999 };
  const resize = () => {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(Math.min(110, (W * H) / 16000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .6, c: Math.random() < .5 ? c1 : c2
    }));
  };
  const LINK = 140;
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = alpha;
    for (const p of pts) {
      if (!still) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 120 && d > 0) { p.x += dx / d * .8; p.y += dy / d * .8; }
      }
    }
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < LINK) {
          ctx.strokeStyle = a.c; ctx.globalAlpha = alpha * (1 - d / LINK) * .35;
          ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (dm < 180) {
        ctx.strokeStyle = c1; ctx.globalAlpha = alpha * (1 - dm / 180) * .5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    for (const p of pts) {
      ctx.globalAlpha = alpha * .9; ctx.fillStyle = p.c;
      ctx.shadowColor = p.c; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    running = false;
    if (!still && !document.hidden) loop();
  };
  let running = false;
  const loop = () => { if (!running) { running = true; requestAnimationFrame(frame); } };
  resize(); frame();
  addEventListener('resize', () => { resize(); if (still) frame(); });
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });
  // pausa cuando la pestaña no está visible (ahorra CPU / batería)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !still) loop(); });
}

// Brillo de la tarjeta que sigue al mouse
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

// ===== Estado =====
let S = {}, GROUPS = [], API = false;
// Sesión de edición: { pin, admin, areas } — se borra al cerrar el navegador
let EDIT = (() => { try { return JSON.parse(sessionStorage.getItem('intranet-edit')) || null; } catch { return null; } })();
const canEdit = (area) => API && EDIT && (EDIT.admin || EDIT.areas.includes(area));
const isAdmin = () => API && EDIT && EDIT.admin;
function setEdit(v) {
  EDIT = v;
  try { v ? sessionStorage.setItem('intranet-edit', JSON.stringify(v)) : sessionStorage.removeItem('intranet-edit'); } catch {}
  const b = $('#editBtn');
  b.textContent = v ? '✓ Salir de edición' : '🔒 Editar';
  b.classList.toggle('on', !!v);
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok || !j.ok) { const e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; }
  return j;
}

async function refresh() {
  GROUPS = await loadYaml('config/services.yaml') || [];
  render();
  $('#q').dispatchEvent(new Event('input'));
  wireSpy();
}

function render() {
  const s = S, groups = GROUPS;
  const main = $('#main'), nav = $('#areas ul');
  main.innerHTML = ''; nav.innerHTML = '';
  $('#areas').hidden = !Array.isArray(groups) || !groups.length;
  if (!Array.isArray(groups) || !groups.length) {
    main.append(el('p', 'msg', 'Todavía no hay áreas cargadas.'));
  }
  const defTarget = s.target || null;
  (Array.isArray(groups) ? groups : []).forEach(g => {
    Object.entries(g || {}).forEach(([groupName, items]) => {
      const id = slug(groupName);
      const sec = el('section', 'group'); sec.id = id;
      const h2 = el('h2', null, groupName);
      const grid = el('div', 'grid');
      let n = 0;
      (items || []).forEach((it, idx) => {
        Object.entries(it || {}).forEach(([name, cfg]) => {
          const href = cfg && cfg.href && safeHref(cfg.href);
          if (!href) return;
          const item = el('div', 'item');
          const a = el('a', 'card');
          a.href = href;
          const target = cfg.target || defTarget;
          if (target) a.target = target;
          if (target === '_blank') a.rel = 'noopener';
          if (cfg.icon) a.append(el('span', 'ico', cfg.icon));
          a.append(el('span', 'name', name));
          if (cfg.description) a.append(el('span', 'desc', cfg.description));
          if (s.show_host) { const host = hostOf(href); if (host) a.append(el('span', 'host', host)); }
          const go = el('span', 'go', target === '_blank' ? '↗' : '→'); go.setAttribute('aria-hidden', 'true');
          a.append(go);
          if (target === '_blank') a.setAttribute('aria-label', name + ' (se abre en una pestaña nueva)');
          a.title = name;
          item.dataset.q = norm([groupName, name, cfg.description].join(' '));
          item.append(a);
          if (canEdit(groupName)) {
            const tools = el('div', 'tools');
            const mk = (txt, label, fn, cls) => { const b = el('button', 'tbtn' + (cls ? ' ' + cls : ''), txt); b.type = 'button'; b.title = label; b.setAttribute('aria-label', label + ' ' + name); b.addEventListener('click', fn); return b; };
            const ref = { area: groupName, index: idx, original: name, cfg };
            if (idx > 0) tools.append(mk('←', 'Mover antes', () => moveSite(ref, -1)));
            if (idx < items.length - 1) tools.append(mk('→', 'Mover después', () => moveSite(ref, 1)));
            tools.append(mk('✎', 'Editar', () => openSite(groupName, ref)));
            tools.append(mk('✕', 'Borrar', () => delSite(ref), 'danger'));
            item.append(tools);
          }
          grid.append(item); n++;
        });
      });
      if (canEdit(groupName)) {
        const add = el('button', 'add'); add.type = 'button';
        add.append(el('span', 'plus', '+'), el('span', null, 'Agregar'));
        add.setAttribute('aria-label', 'Agregar sitio en ' + groupName);
        add.addEventListener('click', () => openSite(groupName, null));
        grid.append(add);
      }
      h2.append(el('small', null, n + (n === 1 ? ' sitio' : ' sitios')));
      if (isAdmin() && n === 0) {
        const d = el('button', 'area-del', 'Borrar área'); d.type = 'button';
        d.addEventListener('click', () => delArea(groupName));
        h2.append(d);
      }
      sec.append(h2, grid);
      main.append(sec);
      const li = el('li'), a = el('a', null, groupName); a.href = '#' + id; li.append(a); nav.append(li);
    });
  });
  if (isAdmin()) {
    const b = el('button', 'btn light new-area', '+ Nueva área'); b.type = 'button';
    b.addEventListener('click', openArea);
    main.append(b);
  }
  main.append(Object.assign(el('p', 'msg empty', 'No hay sitios que coincidan con la búsqueda.'), { id: 'empty' }));
}

// ===== Ventana de alta / edición =====
const EMOJIS = ['💻','🖥️','🐳','☁️','🤖','🧠','📡','🔐','🛠️','⚙️','📊','📚','🧩','🗄️','🌐','🚀'];
let CUR = null;

function openSite(area, ref) {
  CUR = { area, ref };
  $('#dlgTitle').firstChild.textContent = ref ? 'Editar sitio' : 'Agregar sitio';
  $('#dlgArea').textContent = 'Área: ' + area;
  const c = ref ? ref.cfg : {};
  $('#fName').value = ref ? ref.original : '';
  $('#fHref').value = c.href || '';
  $('#fDesc').value = c.description || '';
  $('#fIcon').value = c.icon || '';
  $('#fTarget').value = c.target || S.target || '_blank';
  $('#fErr').textContent = '';
  $('#dlg').showModal();
  $('#fName').focus();
}

async function saveSite(ev) {
  ev.preventDefault();
  const { area, ref } = CUR;
  const body = {
    area, name: $('#fName').value.trim(), href: $('#fHref').value.trim(),
    description: $('#fDesc').value.trim(), icon: $('#fIcon').value.trim(),
    target: $('#fTarget').value, pin: EDIT && EDIT.pin
  };
  if (!body.name) return $('#fErr').textContent = 'Poné un nombre.';
  if (!/^https?:\/\//i.test(body.href)) return $('#fErr').textContent = 'El link tiene que empezar con http:// o https://';
  if (ref) { body.index = ref.index; body.original = ref.original; }
  $('#fSave').disabled = true;
  try {
    await api(ref ? 'PUT' : 'POST', '/api/sites', body);
    $('#dlg').close();
    toast(ref ? 'Cambios guardados' : 'Sitio agregado en ' + area);
    await refresh();
  } catch (e) {
    if (e.status === 401) { $('#dlg').close(); sessionExpired(); return; }
    $('#fErr').textContent = e.message;
  } finally { $('#fSave').disabled = false; }
}

function sessionExpired() { setEdit(null); render(); toast('La clave ya no es válida. Volvé a entrar en modo edición.'); }

async function withPin(key, admin, fn, okMsg) {
  try { await fn(EDIT && EDIT.pin); toast(okMsg); await refresh(); }
  catch (e) { if (e.status === 401) sessionExpired(); else toast(e.message); }
}

function delSite(ref) {
  if (!confirm('¿Borrar "' + ref.original + '" de ' + ref.area + '?')) return;
  withPin(ref.area, false, pin => api('DELETE', '/api/sites', { area: ref.area, index: ref.index, original: ref.original, pin }), 'Sitio borrado');
}

function moveSite(ref, move) {
  const c = ref.cfg;
  withPin(ref.area, false, pin => api('PUT', '/api/sites', {
    area: ref.area, index: ref.index, original: ref.original, move, pin,
    name: ref.original, href: c.href, description: c.description || '', icon: c.icon || '', target: c.target || S.target || '_blank'
  }), 'Orden actualizado');
}

function openArea() {
  $('#aName').value = ''; $('#aErr').textContent = '';
  $('#dlgArea2').showModal(); $('#aName').focus();
}

async function saveArea(ev) {
  ev.preventDefault();
  const name = $('#aName').value.trim(), pin = EDIT && EDIT.pin;
  if (!name) return $('#aErr').textContent = 'Poné un nombre.';
  $('#aSave').disabled = true;
  try {
    await api('POST', '/api/areas', { name, pin });
    $('#dlgArea2').close(); toast('Área creada'); await refresh();
    const sec = document.getElementById(slug(name.toUpperCase())); if (sec) sec.scrollIntoView();
  } catch (e) {
    if (e.status === 401) { $('#dlgArea2').close(); sessionExpired(); return; }
    $('#aErr').textContent = e.message;
  } finally { $('#aSave').disabled = false; }
}

function delArea(name) {
  if (!confirm('¿Borrar el área ' + name + '?')) return;
  withPin('__admin', true, pin => api('DELETE', '/api/areas', { name, pin }), 'Área borrada');
}

async function doLogin(pin) {
  const r = await api('POST', '/api/login', { pin });
  setEdit({ pin, admin: !!r.admin, areas: r.areas || [] });
  render(); $('#q').dispatchEvent(new Event('input'));
  if (r.open) toast('Atención: no hay claves configuradas, cualquiera puede editar.');
  else toast(r.admin ? 'Modo edición: todas las áreas' : 'Modo edición: ' + r.areas.join(', '));
}

function wireEditor() {
  const b = $('#editBtn');
  b.hidden = !API;
  setEdit(API ? EDIT : null);
  b.addEventListener('click', () => {
    if (EDIT) { setEdit(null); render(); $('#q').dispatchEvent(new Event('input')); toast('Saliste del modo edición'); return; }
    $('#lPin').value = ''; $('#lErr').textContent = '';
    $('#dlgLogin').showModal(); $('#lPin').focus();
  });
  $('#lCancel').addEventListener('click', () => $('#dlgLogin').close());
  $('#frmLogin').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('#lSave').disabled = true;
    try { await doLogin($('#lPin').value); $('#dlgLogin').close(); }
    catch (e) { $('#lErr').textContent = e.message; $('#lPin').select(); }
    finally { $('#lSave').disabled = false; }
  });
  $('#frm').addEventListener('submit', saveSite);
  $('#fCancel').addEventListener('click', () => $('#dlg').close());
  $('#frmArea').addEventListener('submit', saveArea);
  $('#aCancel').addEventListener('click', () => $('#dlgArea2').close());
  EMOJIS.forEach(em => { const b = el('button', null, em); b.type = 'button'; b.addEventListener('click', () => { $('#fIcon').value = em; }); $('#emojis').append(b); });
}

// Buscador: filtra tarjetas al escribir; Enter abre el primer resultado; "/" enfoca
function wireSearch() {
  const q = $('#q');
  const run = () => {
    const v = norm(q.value.trim());
    let total = 0;
    document.querySelectorAll('.group').forEach(sec => {
      let vis = 0;
      sec.querySelectorAll('.item').forEach(c => { const ok = !v || c.dataset.q.includes(v); c.hidden = !ok; if (ok) vis++; });
      const add = sec.querySelector('.add'); if (add) add.hidden = !!v;
      sec.hidden = !!v && vis === 0; total += vis;
    });
    const na = document.querySelector('.new-area'); if (na) na.hidden = !!v;
    const e = $('#empty'); if (e) e.style.display = (v && !total) ? 'block' : 'none';
  };
  q.addEventListener('input', run);
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const f = document.querySelector('.item:not([hidden]) .card'); if (f) f.click(); }
    if (e.key === 'Escape') { q.value = ''; run(); q.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
}

// Resalta el área visible en la barra de navegación
let SPY = null;
function wireSpy() {
  if (!('IntersectionObserver' in window)) return;
  if (SPY) SPY.disconnect();
  const links = [...document.querySelectorAll('.areas a')];
  const io = SPY = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) links.forEach(l => l.classList.toggle('on', l.getAttribute('href') === '#' + en.target.id));
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('.group').forEach(g => io.observe(g));
}

(async () => {
  try { S = await loadYaml('config/settings.yaml') || {}; } catch (e) { console.warn(e); }
  applySettings(S);
  try { API = !!(await api('GET', '/api/health')).ok; } catch { API = false; }
  if (S.editable === false) API = false;
  wireEditor(); wireSearch();
  try { await refresh(); }
  catch (e) {
    $('#main').innerHTML = '';
    const p = el('p', 'msg'); p.append('No se pudo leer config/services.yaml', el('br'), e.message);
    $('#main').append(p);
  }
})();
</script>
</body>
</html>
